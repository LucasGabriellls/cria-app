spring:
    datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_SCHEMA}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        database-platform: ${DB_DIALECT}
        hibernate:
          ddl-auto: update
logging:
    level:
      root: INFO
      org.springframework.web: DEBUG
      com.test.cria: DEBUG