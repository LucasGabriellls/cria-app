spring:
    datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_SCHEMA}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
          ddl-auto: update
    config:
      import: "optional:file:.env[.properties]"

jwt:
  secret: ${JWT_SECRET}

logging:
    level:
      root: INFO
      org.springframework.web: DEBUG
      com.test.cria: DEBUG